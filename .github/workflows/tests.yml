name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not librosa_compat and not packaging" --cov=audiosig --cov-report=term-missing

  librosa-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,librosa-compat]"
      - run: python -m pytest tests/test_librosa_compat.py -m librosa_compat -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,build]"
      - run: rm -rf dist build *.egg-info
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pytest tests/test_packaging.py -m packaging -q
