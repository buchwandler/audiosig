name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/audiosig
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$
          test -z "$(git status --porcelain)"
          test "$(python -c 'import audiosig; print(audiosig.__version__)')" = "${GITHUB_REF_NAME#v}"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=audiosig --cov-branch --cov-report=term-missing
      - run: python -m build
      - run: python -m pytest tests/test_packaging.py -q
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
