    section_hash: fb3262de724b7c498402c0e9fdde175b9f765b5d2fb0e2690da554b144ccaeef
    summary: Spectral analysis, pitch tracking, and metrics
    text:
      "## Spectral analysis, pitch tracking, and metrics\n\nThe submodules `audiosig.spectral`,\
      \ `audiosig.pitch`, `audiosig.metrics`, and\n`audiosig.intelligibility` provide\
      \ explicit NumPy APIs without adding runtime\ndependencies. Spectral features\
      \ include STFT/iSTFT, power and Slaney-mel\nspectrograms, natural-log-mel MFCCs,\
      \ frame-center times, and strict frame\nmatching. `pitch_track` returns F0, voicing,\
      \ confidence, and time arrays for\nmono input; `hop_length=None` preserves the\
      \ tracker's legacy frame geometry.\n\nReference metrics return a `MetricResult`\
      \ with a scalar value, units,\ndirectionality, parameters, and diagnostics. Available\
      \ functions include SNR,\nunscaled residual SDR, SI-SDR, log-spectral distance,\
      \ mel-spectral distance,\nlog-mel L1, mel-cepstral distortion, log-F0 RMSE, and\
      \ voiced/unvoiced error.\nSTOI and ESTOI are available from `audiosig.intelligibility`\
      \ and accept only\nequal-length mono floating-point pairs explicitly sampled at\
      \ 10 kHz.\n\n```python\nfrom audiosig.spectral import mel_spectrogram, mfcc, stft\n\
      from audiosig.pitch import pitch_track\nfrom audiosig.metrics import log_spectral_distance,\
      \ si_sdr\nfrom audiosig.intelligibility import estoi, stoi\n\nspectrum = stft(audio,\
      \ n_fft=1024, hop_length=256)\nmel = mel_spectrogram(audio, sample_rate=sample_rate,\
      \ n_fft=1024,\n                      hop_length=256, n_mels=80)\ncepstra = mfcc(audio,\
      \ sample_rate=sample_rate)\ntrack = pitch_track(audio, sample_rate=sample_rate)\
      \  # mono only\n\n# reference and estimate must already have matching shapes and\
      \ sample rates.\nlevel_error = si_sdr(reference, estimate, sample_rate=sample_rate)\n\
      stoi_score = stoi(reference, estimate, sample_rate=10_000)\nestoi_score = estoi(reference,\
      \ estimate, sample_rate=10_000)\n```\n\nMetrics never align, resample, truncate,\
      \ normalize loudness, or downmix their\ninputs. Prepare such transformations explicitly\
      \ and record them at the caller's\nboundary. Speech intelligibility functions\
      \ reject non-10-kHz input rather than\nsilently resampling it. These are deterministic\
      \ signal metrics, not MOS\npredictions or neural/model-based evaluations; AudioSig\
      \ does not download or\nload pretrained models.\n\nSee the [API reference](docs/api-reference.md)\
      \ and [quality evaluation\nnotes](docs/quality-evaluation.md) for definitions,\
      \ limitations, and\nindependent numerical checks."
