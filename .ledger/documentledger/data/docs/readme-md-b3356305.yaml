    summary: PyKokoro integration
    text:
      "## PyKokoro integration\n\nAudioSig provides numeric DSP only. PyKokoro should\
      \ parse SSMD strings at its\napplication boundary, call AudioSig with numeric\
      \ parameters, catch\n`AudioSignalError`, and decide whether to log, retry, or\
      \ return the original\naudio. A stable dependency range such as `audiosig>=0.1.0,<0.2`\
      \ should only be\ndeclared after that release is published on the intended package\
      \ index.\n\nThe relevant numeric operations are `apply_speech_effects`, `apply_gain_db`,\n\
      `energy_based_vad`, `frame_rms`, `resample`, `resample_speed`,\n`resample_to_length`,\
      \ `trim`, and `activity_to_intervals`.\n\n`find_smooth_cut_point` selects a waveform-safe\
      \ candidate inside a caller-provided numeric half-open interval. It uses the sample\
      \ axis and optional preferred anchor supplied by the caller, but it does not decide\
      \ whether that interval is semantically legal or whether a downstream application\
      \ should retry.\n\n```python\nfrom audiosig import find_smooth_cut_point\n\ncandidate\
      \ = find_smooth_cut_point(\n    audio,\n    start=search_start,\n    end=search_end,\n\
      \    anchor=preferred_index,\n    window_length=120,\n )\n```\n\nThis checkout\
      \ contains AudioSig only; downstream source changes and release\nverification\
      \ require the PyKokoro and TTSForge repositories."
