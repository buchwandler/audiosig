  - section_id: md:section:README.md::silence-trimming-and-vad
    doc_path: README.md
    heading_path:
      - AudioSig
      - Silence trimming and VAD
    heading_slug: silence-trimming-and-vad
    line_span:
      - 158
      - 220
    section_hash: 019721beee72f6da786e2eda00af478bc745a38f64da6b17fb2a48901fb280a6
    summary: Silence trimming and VAD
    text:
      "## Silence trimming and VAD\n\n```python\nfrom audiosig import normalized_energy_vad,\
      \ split, trim\n\ntrimmed, interval = trim(\n    audio,\n    top_db=40.0,\n   \
      \ frame_length=512,\n    hop_length=128,\n)\n\nactivity = normalized_energy_vad(\n\
      \    audio,\n    sample_rate,\n    frame_duration_ms=10,\n    energy_threshold=0.15,\n\
      )\n\nintervals = split(audio, top_db=40.0, frame_length=512, hop_length=128)\n\
      ```\n\nPassing `sample_rate` selects normalized-energy VAD compatible with the\
      \ former\nPyKokoro helper. Omitting it selects relative-dB VAD with overlapping\
      \ frame\ncontrols. The package also exports framing, frame RMS, short-time energy,\n\
      zero-crossing rate, spectral flux, median smoothing, decibel conversion, and\n\
      non-silent-frame detection.\n`split` returns clipped half-open `[start, end)`\
      \ intervals for every active\nregion, while `trim` returns the single outer interval.\n\
      The compatibility `energy_based_vad` wrapper remains available; explicit\n`normalized_energy_vad`\
      \ and `relative_db_vad` functions make the algorithm\nchoice visible. Normalized\
      \ VAD preserves its historical `pad_end=False`\ndefault, while `pad_end=True`\
      \ analyzes trailing partial speech. Use\n`find_speech_bounds` when `[0, 0]` must\
      \ be distinguishable from speech at\nsample zero.\n\nSynthetic examples are available\
      \ under [`examples/`](examples/README.md). They\nuse sine waves and seeded noise,\
      \ so no input recordings or optional packages\nare required.\n\nAudioSig provides\
      \ speech-oriented NumPy WSOLA and experimental ESOLA backends\nfor moderate rate\
      \ and prosody changes, plus a basic phase-vocoder backend for\ngeneric numerical\
      \ use. Select ESOLA with `method=\"esola\"` and provide\n`sample_rate`; its supported\
      \ rate range is `0.5 <= rate <= 2.0`. The\nspeech-effects compositor uses WSOLA\
      \ by default and combines pitch and rate in\none time-scale pass. ESOLA is not\
      \ a general music stretcher, does not claim\nformant preservation, and has not\
      \ been validated as an extreme-speed solution.\nThe experimental `method=\"td_psola\"\
      ` option is available only through\n`pitch_shift` and `apply_speech_effects`:\
      \ it directly modifies voiced speech\npulses and uses WSOLA for unvoiced duration\
      \ changes. It is limited to\n`-6 <= semitones <= 6` and `0.75 <= rate <= 1.5`,\
      \ is not a music or polyphonic\npitch shifter, and does not guarantee formant\
      \ preservation. It is not a\ndefault; see the [TD-PSOLA listening protocol](docs/td-psola-listening-evaluation-2026-07-31.md)\n\
      before considering any promotion.\nAll public effects preserve exact output-length,\
      \ dtype, axis, copy, and finite\ninput contracts. Invalid arrays and parameters\
      \ raise typed `AudioSig`\nexceptions so applications can choose their own fail-open\
      \ or fail-fast policy.\n\nAudioSig supports Python 3.10 through 3.14 and requires\
      \ NumPy 1.24 or newer.\nThe package is licensed under Apache-2.0. See\n[`THIRD_PARTY_NOTICES.md`](THIRD_PARTY_NOTICES.md)\
      \ for the provenance boundary\nof the clean-room silence/VAD implementation."
    links: []
