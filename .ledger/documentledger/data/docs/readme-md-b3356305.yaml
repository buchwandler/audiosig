    section_hash: 616d9707e7b8b21c25cb26418bd7c2429aff61614e74820f656042cc4f69e149
    summary: Basic usage
    text:
      "## Basic usage\n\n```python\nimport numpy as np\nfrom audiosig import (\n\
      \    apply_speech_effects,\n    generate_silence,\n    pitch_shift,\n    resample_speed,\n\
      \    resample_to_length,\n    time_stretch,\n)\n\nsample_rate = 24_000\naudio\
      \ = np.zeros(sample_rate, dtype=np.float32)\n\nfaster = time_stretch(audio, rate=1.1)\n\
      higher = pitch_shift(audio, sample_rate=sample_rate, semitones=2.0)\nexact = resample_to_length(audio,\
      \ 12_000)\nfaster_playback = resample_speed(audio, speed=1.25)\nspeech_effects\
      \ = apply_speech_effects(audio, sample_rate=sample_rate, rate=1.1)\npause = generate_silence(0.25,\
      \ sample_rate)\n```\n\nAudioSig accepts `float32` and `float64` NumPy arrays shaped\
      \ as `(samples,)`,\n`(channels, samples)`, or arbitrary leading batch dimensions\
      \ followed by the\nsample axis. The public functions never mutate their input\
      \ and preserve the\nfloating-point dtype.\n\n`time_stretch(rate=1.1)` makes audio\
      \ faster and shorter; rates below one make\nit slower and longer. `pitch_shift(semitones=2)`\
      \ raises pitch while preserving\nthe exact input length. `resample_speed` changes\
      \ both duration and pitch,\nwhile `resample_to_length` targets an exact sample\
      \ count. Regular resampling\nuses a finite windowed-sinc low-pass filter and produces\n\
      `round(input_length * target_rate / source_rate)` samples."
    links: []
