      "### Normalized Energy VAD\n\nBest for speech detection with known sample\
      \ rate:\n\n```python\nfrom audiosig import normalized_energy_vad\n\nactivity =\
      \ normalized_energy_vad(\n    audio,\n    sample_rate=24000,\n    frame_duration_ms=10,\
      \      # Frame size in milliseconds\n    energy_threshold=0.15,     # Threshold\
      \ in [0, 1]\n    pad_end=False,             # Discard trailing partial frame\n\
      )\n```"
