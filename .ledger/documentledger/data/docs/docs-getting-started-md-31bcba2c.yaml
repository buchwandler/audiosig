      - Loudness Measurement
    heading_slug: loudness-measurement
    line_span:
      - 123
      - 141
    section_hash: 92bb5435bdc9d44a4a28ab9683589b6a873292c5c70532a0080c396b1f297327
    summary: Loudness Measurement
    text:
      "### Loudness Measurement\n\nUse integrated loudness when comparing perceived\
      \ programme level, rather than treating peak normalization or full-file RMS as\
      \ a loudness meter:\n\n```python\nimport audiosig\n\nmetrics = audiosig.measure_loudness(audio,\
      \ sample_rate=24_000)\nprint(metrics.integrated_lufs, metrics.sample_peak_dbfs,\
      \ metrics.true_peak_dbtp)\n\nbefore = audiosig.integrated_loudness(audio, sample_rate=24_000)\n\
      after = audiosig.integrated_loudness(\n    audiosig.apply_gain_db(audio, 3.0),\
      \ sample_rate=24_000\n)\nassert abs((after - before) - 3.0) < 0.05\n```\n\n`integrated_loudness`\
      \ follows BS.1770-style K-weighting and gated 400 ms blocks. `sample_peak_dbfs`\
      \ is the discrete sample maximum; `true_peak_dbtp` uses configurable oversampling\
      \ (4x by default) to estimate inter-sample overshoot. These functions measure\
      \ only: they do not clip, limit, or normalize audio. V1 accepts mono one-dimensional\
      \ arrays and validates the mandatory 24 kHz case, plus 44.1 and 48 kHz. Silence\
      \ returns `-math.inf`; empty, non-finite, and inputs shorter than 400 ms have\
      \ explicit validation/deterministic behavior documented in the API reference."
    links: []
