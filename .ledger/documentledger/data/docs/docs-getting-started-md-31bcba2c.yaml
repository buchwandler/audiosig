    summary: Silence Detection and Trimming
    text:
      "### Silence Detection and Trimming\n\n```python\nfrom audiosig import trim,\
      \ split, normalized_energy_vad\n\n# Trim silence from beginning and end\ntrimmed,\
      \ interval = trim(audio, top_db=40.0)\n\n# Split audio into non-silent segments\n\
      intervals = split(audio, top_db=40.0)\n\n# Voice Activity Detection\nactivity\
      \ = normalized_energy_vad(\n    audio,\n    sample_rate,\n    frame_duration_ms=10,\n\
      \    energy_threshold=0.15,\n)\n```"
    links: []
