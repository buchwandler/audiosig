    section_hash: 32cde56eb2b4e274c7bf8b811f0b472782d64e786a95bbd4823a9f4ca5693dcd
    summary: Pitch Shifting
    text:
      "### Pitch Shifting\n\n`pitch_shift(audio, sample_rate, semitones)` changes\
      \ pitch while preserving duration:\n\n- `semitones > 0`: Higher pitch\n- `semitones\
      \ < 0`: Lower pitch\n- `semitones = 0`: No change (returns copy)\n\n```python\n\
      from audiosig import pitch_shift\n\n# Raise pitch by 3 semitones\nhigher = pitch_shift(audio,\
      \ sample_rate=24000, semitones=3.0)\n\n# Lower pitch by 5 semitones\nlower = pitch_shift(audio,\
      \ sample_rate=24000, semitones=-5.0)\n```\n\nFor experimental speech-only direct\
      \ pitch/prosody processing, opt in with\n`method=\"td_psola\"`. Moderate changes\
      \ only are supported; unvoiced regions are\nduration-scaled without pitch synthesis\
      \ and formant preservation is not\nguaranteed:\n\n```python\nfrom audiosig import\
      \ apply_speech_effects, pitch_shift\n\nvoice_up = pitch_shift(audio, sample_rate=24_000,\
      \ semitones=4.0, method=\"td_psola\")\nslower_voice = apply_speech_effects(\n\
      \    audio,\n    sample_rate=24_000,\n    rate=0.85,\n    semitones=-3.0,\n  \
      \  method=\"td_psola\",\n)\n```\n\nTD-PSOLA is experimental and intended for clean\
      \ or mildly noisy speech, not\nmusic, polyphony, strong noise, reverb, creaky\
      \ voice, or extreme shifts."
    links: []
