    summary: Smooth Cut-Point Selection
    text:
      "### Smooth Cut-Point Selection\n\nWhen an application already has a legal\
      \ numeric interval, it can choose a low-disruption waveform boundary without changing\
      \ the audio:\n\n```python\nfrom audiosig import find_smooth_cut_point\n\ncandidate\
      \ = find_smooth_cut_point(\n    audio,\n    start=search_start,\n    end=search_end,\n\
      \    anchor=preferred_index,\n    window_length=120,\n )\n```\n\nThe interval\
      \ is half-open, the anchor is only a preference, and the function always returns\
      \ a legal candidate for a non-empty interval. It is not a silence detector. Invalid\
      \ arrays or parameters raise typed `AudioSig` exceptions. The application must\
      \ decide whether the interval is semantically legal and whether a failed downstream\
      \ policy should retry."
