    section_hash: 9eee05638c32148d6d509abbe761ca65218f068269d5d325280e344c9850e0f1
    summary: Data types
    text:
      "### Data types\n\n- Audio inputs must be `float32` or `float64` NumPy arrays.\n\
      - Audio transforms such as gain, resampling, time stretching, pitch shifting,\n\
      \  and trimming preserve the audio dtype.\n- Feature and decibel functions may\
      \ return `float32` or `float64` as documented.\n- VAD functions return boolean\
      \ masks.\n- Interval and frame-index conversion functions return integer values.\n\
      - Public operations do not mutate the input audio."
    links: []
