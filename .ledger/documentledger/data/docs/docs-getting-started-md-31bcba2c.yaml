    section_hash: 80346168247c239ae848ab1417e21ebf9ce5284e63316c9126df405929f9ad45
    summary: split()
    text:
      "### split()\n\nReturns all non-silent segments:\n\n```python\nfrom audiosig\
      \ import split\n\nintervals = split(\n    audio,\n    top_db=40.0,\n    frame_length=512,\n\
      \    hop_length=128,\n)\n\n# Each interval is [start, end) half-open\nfor start,\
      \ end in intervals:\n    segment = audio[start:end]\n    process_segment(segment)\n\
      ```"
