    section_hash: 53091b9a4231da59890da13eecb79a1f3a8cce49ac1740733bdb5bee01b81d80
    summary: "`integrated_loudness(audio, *, sample_rate, axis=-1)`"
    text: "#### `integrated_loudness(audio, *, sample_rate, axis=-1)`


      Return BS.1770-style integrated programme loudness in LUFS. Audio is K-weighted,
      divided into complete 400 ms blocks with a 100 ms hop, then processed with the
      -70 LUFS absolute gate and -10 LU relative gate. Signals shorter than one complete
      block return `-math.inf` without invented padding. V1 accepts one-dimensional
      mono `float32`/`float64` arrays; the mandatory sample rate is 24,000 Hz, and 44,100
      and 48,000 Hz are also supported. Digital silence returns `-math.inf`."
    links: []
