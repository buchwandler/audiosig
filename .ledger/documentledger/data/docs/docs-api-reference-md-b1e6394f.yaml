    heading_slug: spectral-features-audiosig-spectral
    line_span:
      - 530
      - 554
    section_hash: 05fa11be96294ef91b69cfb2647e91828b70d6d1c52da076c134da96f2b97102
    summary: Spectral features (`audiosig.spectral`)
    text:
      "### Spectral features (`audiosig.spectral`)\n\n- `stft(audio, *, n_fft, hop_length,\
      \ center=True)` returns the existing\n  Hann-windowed complex STFT with shape\
      \ `(..., n_fft // 2 + 1, frames)`.\n  It preserves the private spectral path's\
      \ conventions.\n- `istft(spectrum, *, n_fft, hop_length, length=None, center=True,\n\
      \  dtype=np.float64)` uses the existing overlap-add inverse and returns\n  `float32`\
      \ or `float64` samples.\n- `power_spectrogram(audio, *, n_fft, hop_length, center=True,\
      \ power=2.0)`\n  returns linear `abs(STFT) ** power`, without normalization or\
      \ dB conversion.\n- `mel_filterbank(*, sample_rate, n_fft, n_mels, f_min=0.0,\
      \ f_max=None,\n  mel_scale='slaney', norm='slaney')` creates Slaney mel triangles\
      \ on exact\n  real-FFT bin centers. `norm=None` disables area normalization.\n\
      - `mel_spectrogram(..., log=False, log_floor=1e-10)` returns linear mel power\n\
      \  by default. `log=True` returns `ln(max(mel_power, log_floor))`; it does not\n\
      \  apply a power-to-dB transform.\n- `mfcc(..., n_fft=1024, hop_length=256, n_mfcc=13,\
      \ n_mels=40, center=True,\n  ...)` computes an orthonormal DCT-II of natural-log\
      \ mel power. Output shape is\n  `(..., n_mfcc, frames)`; coefficient zero is included.\n\
      - `frame_times(n_frames, *, sample_rate, hop_length, frame_length=None,\n  center=True)`\
      \ returns frame-center times in seconds. For `center=False`,\n  `frame_length`\
      \ is required.\n- `match_frames(reference, estimate, *, frame_axis=-1)` accepts\
      \ only arrays with\n  identical shape. It validates correspondence and never crops\
      \ or aligns."
