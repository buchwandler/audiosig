    text:
      "#### `normalized_energy_vad(audio, sample_rate, *, frame_duration_ms=5.0,\
      \ energy_threshold=0.02, axis=-1, pad_end=False)`\n\nDetect voice activity using\
      \ normalized RMS energy.\n\n**Parameters:**\n\n- `audio` (np.ndarray): Input audio\
      \ array\n- `sample_rate` (int): Audio sample rate in Hz\n- `frame_duration_ms`\
      \ (float): Frame duration in milliseconds (default: 5.0)\n- `energy_threshold`\
      \ (float): Threshold in [0, 1] (default: 0.02)\n- `axis` (int): Sample axis (default:\
      \ -1)\n- `pad_end` (bool): Include trailing partial frame (default: False)\n\n\
      **Returns:** np.ndarray - Boolean array indicating active frames\n\n**Example:**\n\
      \n```python\nfrom audiosig import normalized_energy_vad\n\nactivity = normalized_energy_vad(\n\
      \    audio,\n    sample_rate=24000,\n    frame_duration_ms=10,\n    energy_threshold=0.15,\n\
      )\n\n# Count active frames\nactive_frames = np.sum(activity)\n```\n\n---"
    links: []
