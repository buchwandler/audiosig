    section_hash: 19a244b57b7ccca3bc4edc803469e887bf776caef15465b6d23d7dc11ff87b96
    summary: Pitch tracking (`audiosig.pitch`)
    text: "### Pitch tracking (`audiosig.pitch`)


      `PitchTrack` is a frozen, slotted result object with `frame_times_s`, `f0_hz`,

      `voiced`, and `confidence` arrays. `pitch_track(audio, *, sample_rate,

      hop_length=None, f0_min=60.0, f0_max=500.0)` accepts only mono arrays shaped

      `(samples,)`. The optional hop changes analysis geometry; `None` preserves the

      legacy tracker default. Callers with multiple channels must explicitly select
      a

      channel or downmix before analysis. Unvoiced frames are identified by `voiced`;

      consult the track's voicing mask rather than treating all F0 values as speech

      pitch."
