        axis=-1, n_fft=2048, hop_length=None, filter_width=32, rolloff=0.945)`"
    heading_slug: pitch-shift-audio-sample-rate-semitones-bins-per-octave-12-method-phase-vocoder-axis-1-n-fft-2048-hop-length-none-filter-width-32-rolloff-0-945
    line_span:
      - 77
      - 107
    section_hash: ee0ceed2461d04676f81891f773af30cf1b4f534e94fe32d5070de0f6110bc62
    summary:
      "`pitch_shift(audio, *, sample_rate, semitones, bins_per_octave=12, method='phase_vocoder',
      axis=-1, n_fft=2048, hop_length=None, filter_width=32, rolloff=0.945)`"
    text:
      "#### `pitch_shift(audio, *, sample_rate, semitones, bins_per_octave=12, method='phase_vocoder',
      axis=-1, n_fft=2048, hop_length=None, filter_width=32, rolloff=0.945)`


      Shift pitch by semitones while preserving exact input duration.


      **Parameters:**


      - `audio` (np.ndarray): Input audio array

      - `sample_rate` (int): Audio sample rate in Hz

      - `semitones` (float): Pitch shift in semitones (positive = higher, negative =
      lower)

      - `bins_per_octave` (int): Semitones per octave (default: 12)

      - `axis` (int): Sample axis (default: -1)

      - `n_fft` (int): FFT window size (default: 2048)

      - `hop_length` (int, optional): Hop size

      - `filter_width` (int): Resampling filter width (default: 32)

      - `method` (`'phase_vocoder'`, `'wsola'`, `'esola'`, or `'td_psola'`):
      Pitch method. `td_psola` directly synthesizes voiced speech and does not resample
      the complete waveform.

      - `rolloff` (float): Pitch-resampler rolloff (default: 0.945)


      **Returns:** np.ndarray - Pitch-shifted audio with exact same length as input


      **Example:**


      ```python

      from audiosig import pitch_shift


      # Raise pitch by 2 semitones

      higher = pitch_shift(audio, sample_rate=24000, semitones=2.0)


      # Lower pitch by 5 semitones

      lower = pitch_shift(audio, sample_rate=24000, semitones=-5.0)

      ```"
    links: []
