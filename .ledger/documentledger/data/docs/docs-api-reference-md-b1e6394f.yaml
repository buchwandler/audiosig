    heading_slug: apply-speech-effects-audio-sample-rate-rate-1-0-semitones-0-0-gain-db-0-0-axis-1-clip-false-method-wsola-n-fft-2048-hop-length-none-filter-width-32-rolloff-0-945
    line_span:
      - 108
      - 119
    section_hash: 4bbc2a1406f1969dab5457ee3a8e66e36c16c646c5e7a7a3ba5611512a9b2838
    summary:
      "`apply_speech_effects(audio, *, sample_rate, rate=1.0, semitones=0.0,
      gain_db=0.0, axis=-1, clip=False, method='wsola', n_fft=2048, hop_length=None,
      filter_width=32, rolloff=0.945)`"
    text:
      "#### `apply_speech_effects(audio, *, sample_rate, rate=1.0, semitones=0.0,
      gain_db=0.0, axis=-1, clip=False, method='wsola', n_fft=2048, hop_length=None,
      filter_width=32, rolloff=0.945)`


      Apply numeric speech effects using one planned pitch/rate time-scale pass,

      optional resampling, and gain. WSOLA is the default speech backend;

      `method='phase_vocoder'` selects the generic reference path,

      `method='esola'` selects the experimental epoch-synchronous path, and

      `method='td_psola'` selects the experimental direct speech pitch/prosody path.

      The output length is exactly `round(input_samples / rate)` for non-empty input.

      TD-PSOLA supports `0.75 <= rate <= 1.5` and `-6 <= semitones <= 6`; it does not

      guarantee vocal-formant preservation. This compositor does not parse SSMD strings
      and raises typed

      AudioSig exceptions for invalid input or parameters."
    links: []
  - section_id: md:section:docs/api-reference.md::apply-speech-effects-envelope-audio-sample-rate-rate-points-pitch-points-time-base-output-interpolation-linear-method-wsola-axis-1
    doc_path: docs/api-reference.md
    heading_path:
      - AudioSig API Reference
      - Core Functions
      - Time and Pitch Effects
      - "`apply_speech_effects_envelope(audio, *, sample_rate, rate_points=(), pitch_points=(),
        time_base='output', interpolation='linear', method='wsola', axis=-1)`"
    heading_slug: apply-speech-effects-envelope-audio-sample-rate-rate-points-pitch-points-time-base-output-interpolation-linear-method-wsola-axis-1
    line_span:
      - 120
      - 158
    section_hash: 82af78bd50aecbd7d221e584b4c8dc7c4872650ac435481cf22df4794954d52d
    summary:
      "`apply_speech_effects_envelope(audio, *, sample_rate, rate_points=(),
      pitch_points=(), time_base='output', interpolation='linear', method='wsola',
      axis=-1)`"
    text:
      "#### `apply_speech_effects_envelope(audio, *, sample_rate, rate_points=(),\
      \ pitch_points=(), time_base='output', interpolation='linear', method='wsola',\
      \ axis=-1)`\n\nApply continuously varying playback rate and pitch controls in\
      \ one speech-processing operation. AudioSig 0.1.5 is the minimum version containing\
      \ this API.\n\n**Control points:**\n\n- `rate_points`: `(output_seconds, rate_factor)`\
      \ pairs. Factors must be finite and positive. `1.0` is unchanged, values below\
      \ `1.0` slow playback, and values above `1.0` speed it up.\n- `pitch_points`:\
      \ `(output_seconds, semitones)` pairs. Values are finite semitone offsets, where\
      \ `0.0` is unchanged and positive values raise pitch.\n- At least one curve must\
      \ be non-empty. Omitted rate and pitch curves mean constant `1.0` and `0.0`, respectively.\n\
      - Every non-empty curve starts exactly at `0.0` seconds. Times increase strictly.\
      \ `interpolation='linear'` interpolates rate factors and semitones; the last value\
      \ is held after the final point.\n- `time_base='output'` is the supported time\
      \ base. Point times refer to the transformed output, so a transition ending at\
      \ `0.3` seconds lasts 0.3 seconds in the result regardless of rate changes.\n\
      - `method` accepts `'wsola'` or `'td_psola'`. For nonconstant rate with neutral\
      \ pitch, WSOLA selects mapped WSOLA and TD-PSOLA selects voiced pulse synthesis\
      \ with mapped WSOLA fallback. Any nonconstant pitch uses the coordinated TD-PSOLA\
      \ voiced path and mapped WSOLA fallback for unvoiced spans.\n- `axis` selects\
      \ the sample dimension. Every channel uses the same timing curves and frame count.\n\
      \nThe rate map integrates `r(y)` to obtain source time `x(y)`. The output duration\
      \ is the inverse-map time satisfying `x(y) = input_frames / sample_rate`, and\
      \ the returned frame count is `round(y * sample_rate)` using float64 timing calculations.\
      \ Pitch-only automation preserves the input frame count. A short clip evaluates\
      \ only the portion of each curve reached by its output; AudioSig does not compress\
      \ the curve to force its final value.\n\nConstant curves agree with `apply_speech_effects`.\
      \ Identity curves return an independent copy. Silence remains zero. The operation\
      \ is deterministic for the same input and AudioSig version, but exact PCM is not\
      \ promised across versions.\n\n```python\nfrom audiosig import apply_speech_effects_envelope,\
      \ speech_effects_output_frames\n\nout = apply_speech_effects_envelope(\n    audio,\n\
      \    sample_rate=24_000,\n    rate_points=((0.0, 1.0), (0.45, 0.85)),\n    pitch_points=((0.0,\
      \ 0.0), (0.30, 2.0)),\n)\npredicted_frames = speech_effects_output_frames(\n \
      \   audio.shape[-1],\n    sample_rate=24_000,\n    rate_points=((0.0, 1.0), (0.45,\
      \ 0.85)),\n)\nassert out.shape[-1] == predicted_frames\n```\n\nMalformed points,\
      \ unsupported method/options, and invalid sample rates raise `InvalidParameterError`;\
      \ malformed audio shapes use `AudioShapeError`.\n\n---"
    links: []
