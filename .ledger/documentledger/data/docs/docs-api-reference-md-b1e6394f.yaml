  - section_id: md:section:docs/api-reference.md::formula-conventions-and-comparability
    doc_path: docs/api-reference.md
    heading_path:
      - AudioSig API Reference
      - Reference Metrics
      - Formula conventions and comparability
    heading_slug: formula-conventions-and-comparability
    line_span:
      - 596
      - 657
    section_hash: cc147ea22d29847f6af079a6bcea2d149de2b8ea5abb568b28d3182ee2d3dcd5
    summary: Formula conventions and comparability
    text:
      "### Formula conventions and comparability\n\nLet `r` be the reference waveform\
      \ and `y` the estimate. SNR and this package's\nexplicitly unscaled SDR both use\n\
      \n```text\n10 * log10(sum(r**2) / sum((r - y)**2))\n```\n\nThere is no gain fit\
      \ or centering in these two metrics. A zero-energy reference\nis invalid; an exact\
      \ reconstruction has zero residual and returns positive\ninfinity. SI-SDR optionally\
      \ removes each lane's mean first (default true), then\nflattens the remaining\
      \ samples and fits one global scale\n`alpha = dot(y, r) / dot(r, r)`. Its score\
      \ is\n`10 * log10(sum((alpha*r)**2) / sum((y - alpha*r)**2))`.\n\nLet `X_r` and\
      \ `X_y` be reference/estimate STFTs, and `M_r` and `M_y` their\nmel-power features.\
      \ Means below cover every lane and frame (and, for log-mel,\nevery mel band);\
      \ spectral distances take an RMS across frequency or mel bands\nbefore averaging\
      \ lanes and frames.\n\n```text\nLSD = mean(lane, frame) sqrt(mean_bin(\n    (max(20*log10(abs(X_r)),\
      \ db_floor)\n  - max(20*log10(abs(X_y)), db_floor))**2))\n\nmel_spectral_distance\
      \ = mean(lane, frame) sqrt(mean_mel(\n    (max(10*log10(M_r), db_floor)\n  - max(10*log10(M_y),\
      \ db_floor))**2))\n\nlog_mel_l1 = mean(abs(ln(max(M_r, log_floor)) - ln(max(M_y,\
      \ log_floor))))\n```\n\nDefaults are `n_fft=1024`, `hop_length=256`, `center=True`,\
      \ `n_mels=80`,\n`db_floor=-120.0`, and `log_floor=1e-10`, as applicable. Mel features\
      \ use\nSlaney scaling and area normalization. The complete chosen recipe is recorded\n\
      in `MetricResult.parameters`.\n\nFor MFCC vectors `c_r` and `c_y`, MCD is\n\n\
      ```text\nmean(lane, frame) (10*sqrt(2)/ln(10)) *\n    sqrt(sum_{k in K} (c_r[k]\
      \ - c_y[k])**2)\n```\n\nwhere `K={1,...,n_mfcc-1}` by default and `K={0,...,n_mfcc-1}`\
      \ with\n`include_c0=True`. There is no DTW. MCD scores are comparable only when\
      \ the\ncomplete MFCC recipe, including sample rate, FFT/hop, mel scale and count,\n\
      frequency limits, log floor, centering, coefficient count, and c0 policy,\nmatches.\n\
      \nFor pitch, `log_f0_rmse` is\n`sqrt(mean((ln(f0_reference) - ln(f0_estimate))**2))`\
      \ over jointly voiced\nframes. It returns `None` when there are no such frames.\
      \ The V/UV error is the\nnumber of differing voiced/unvoiced decisions divided\
      \ by all pitch frames.\n`MetricResult.higher_is_better` states the direction for\
      \ each metric; values\nare not clipped to an arbitrary range.\n\nSpectral and\
      \ pitch parameters, floors, feature geometry, and diagnostics are\nrecorded in\
      \ each result. Pitch metrics are mono-only. Log-F0 RMSE compares only\njointly\
      \ voiced frames; V/UV error compares the complete voicing masks."
