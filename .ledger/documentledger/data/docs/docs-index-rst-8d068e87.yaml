    text:
      "AudioSig\n========\n\nAudioSig is a portable, NumPy-only signal-processing\
      \ layer for speech and TTS\napplications. It provides waveform effects, spectral\
      \ and pitch analysis, and\nreference metrics without model downloads or neural\
      \ inference. STOI/ESTOI require\nexplicit equal-length mono input at 10 kHz.\n\
      \nPublic behavior\n---------------\n\nThe package accepts ``float32`` and ``float64``\
      \ NumPy arrays and keeps the\nsample axis explicit through the public APIs. ``split``\
      \ returns clipped,\nhalf-open non-silent sample intervals. ``normalized_energy_vad``\
      \ preserves its\nhistorical non-padded default; pass ``pad_end=True`` when trailing\
      \ partial\nspeech must be analyzed. ``find_speech_bounds`` returns ``[0, 0]``\
      \ when no\nspeech is found.\n\nSee the repository README for the detailed replacement\
      \ boundary and downstream\naudit status.\n\nDocumentation\n-------------\n\n..\
      \ toctree::\n   :maxdepth: 2\n   :caption: Contents:\n\n   getting-started.md\n\
      \   api-reference.md\n   examples.md\n   advanced.md\n\n   quality-evaluation.md\n\
      \   changelog.md\n\nIndices and tables\n------------------\n\n* :ref:`genindex`\n\
      * :ref:`modindex`\n* :ref:`search`"
