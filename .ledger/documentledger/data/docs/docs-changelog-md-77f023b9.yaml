    heading_slug: added-7
    line_span:
      - 81
      - 96
    section_hash: 7890339ec1747527385309f1a621267af55dea39888862537548a18287f3a909
    summary: Added
    text: "### Added


      - Phase-vocoder time stretching with configurable window size and overlap

      - Windowed-sinc resampler with rounded output sizing and an optional librosa-compatible
      ceiling mode

      - Pitch shifting via resample-then-stretch that preserves exact input length

      - Normalized-energy and relative-dB voice activity detection algorithms

      - RMS amplitude normalization and peak amplitude utilities

      - Silence trimming and audio splitting with configurable frame parameters

      - Audio framing, short-time energy, zero-crossing rate, and spectral flux utilities

      - Typed AudioSignalError exceptions for invalid arrays and parameters

      - NumPy-only dependency with no native extensions required

      - NumPy-only WSOLA speech backend with explicit backend selection

      - Experimental NumPy-only ESOLA speech backend with exact-length synthesis, epoch
      alignment, and explicit moderate-rate validation

      - Experimental NumPy-only direct TD-PSOLA speech pitch/prosody backend with bounded
      pitch tracking, voiced-grain synthesis, and WSOLA unvoiced fallback

      - Single-pass pitch/rate compositor planner and deterministic quality harness"
    links: []
