    section_hash: 8ba3ae983ed5791953bfd0fbbad76bf7a61af1ab578964f3c19a8f6c82762ab1
    summary: Added
    text:
      "### Added\n\n- Phase-vocoder time stretching with configurable window size\
      \ and overlap\n- NumPy-only WSOLA speech backend with explicit backend selection\n\
      - Experimental NumPy-only ESOLA speech backend with exact-length synthesis,\n\
      \  epoch alignment, and explicit moderate-rate validation\n- Experimental NumPy-only\
      \ direct TD-PSOLA speech pitch/prosody backend with\n  bounded pitch tracking,\
      \ voiced-grain synthesis, and WSOLA unvoiced fallback\n- Single-pass pitch/rate\
      \ compositor planner and deterministic quality harness\n- Windowed-sinc resampler\
      \ with rounded output sizing and an optional librosa-compatible ceiling mode\n\
      - Pitch shifting via resample-then-stretch that preserves exact input length\n\
      - Normalized-energy and relative-dB voice activity detection algorithms\n- RMS\
      \ amplitude normalization and peak amplitude utilities\n- Silence trimming and\
      \ audio splitting with configurable frame parameters\n- Audio framing, short-time\
      \ energy, zero-crossing rate, and spectral flux utilities\n- Typed AudioSignalError\
      \ exceptions for invalid arrays and parameters\n- NumPy-only dependency with no\
      \ native extensions required"
    links: []
