    section_hash: cfa102aaa0c6150b1e4917ad4e55f36613d1a83246ac57805c343829667a7192
    summary: Time-varying envelope evaluation
    text: "## Time-varying envelope evaluation


      The envelope regression tests live in `tests/test_automation.py`, `tests/test_speech_envelope.py`,
      and `tests/test_speech_envelope_quality.py`. They cover analytical integration
      and inverse-map round trips, exact output sizing, amplitude-coded source landmarks,
      local pitch trajectories, combined automation, voiced/unvoiced fallback, output-knot
      jumps, and high-frequency burst guards. These objective tests are diagnostics,
      not a substitute for listening.


      Reproduce the 1, 10, and 60 second envelope benchmark with:


      ```bash

      python scripts/benchmark_speech_envelopes.py --output /tmp/speech-envelope-benchmark.json

      ```


      The script runs static rate, static pitch, static combined, variable-rate, variable-pitch,
      and combined-variable cases on a deterministic 16 kHz harmonic fixture. Constant-rate
      baselines are chosen to match the variable-rate output frame count. It records
      runtime, real-time factor, expected/output frames, length error, finite status,
      environment, and variable/static runtime ratio. A ratio above `1.0` means the
      envelope case took longer. This is a single sequential run without warm-up, so
      treat timings as indicative rather than a performance guarantee.


      Recorded on Python 3.13.14, NumPy 2.5.3, AudioSig working-tree metadata 0.1.4,
      Linux 6.18.33.2 under WSL2, Intel Core Ultra 7 355, 8 logical CPUs. All 18 outputs
      were finite and had zero frame error. Relative elapsed-time ratios were:


      | Input | Variable rate / static rate | Variable pitch / static pitch | Combined
      variable / static combined |

      | ----: | --------------------------: | ----------------------------: | ----------------------------------:
      |

      |   1 s |                       1.277 |                         1.054 |                               0.948
      |

      |  10 s |                       1.205 |                         1.133 |                               0.929
      |

      |  60 s |                       0.950 |                         0.866 |                               0.968
      |


      The fixture is synthetic and fully voiced. These timings do not establish perceptual
      quality or predict every speech input.


      The feature is available since AudioSig 0.1.5. After redoing all three A/B comparisons
      on a permitted user-created PCM WAV, the user could not hear a clear difference
      and considered the static and envelope renders the same. This is one listener's
      subjective result for this source and these settings, not a general claim of equivalence.
      Findings are in the [listening report](envelope-listening-evaluation.md). The
      source and rendered files remain local and are not part of release materials.


      Variable-rate-only runs use the absolute integrated rate map with WSOLA. Any variable
      pitch uses TD-PSOLA on voiced regions and mapped WSOLA for unvoiced fallback;
      the speech path is not formant-preserving and larger shifts can sound more artifact-prone.
      Results are deterministic within an AudioSig version but are not promised to be
      bit-identical across versions.


      The listening report records the corrected result and can capture further listeners
      or samples. This listening step is complete for the current sample; overall release
      acceptance still depends on remaining technical validation."
