    section_hash: 767f9c73aaa09dbdeca8c53f76c81137225702748de81e0cb0a6c586ed2a2f85
    summary: Corpus and reproducibility
    text:
      "## Corpus and reproducibility\n\nUse licensed or consented 16/24/48 kHz mono\
      \ or stereo WAV material and record,\nfor every source: corpus/license, attribution,\
      \ sample rate, filename or stable\nidentifier, channel count, and whether the\
      \ segment is clean, noisy, breathy,\ncreaky, reverberant, or TTS-generated. Do\
      \ not commit private speech recordings.\n\nRender with:\n\n```bash\npython scripts/compare_speech_effects.py\
      \ INPUT.wav OUTPUT_DIR \\\n  --rates 0.8 1.0 1.25 --semitones -6 -4 -2 2 4 6\n\
      ```\n\nThe comparison output records exact-length error, finite output, RMS/peak,\n\
      continuity jumps, runtime, and generated WAVs. Keep `metrics.json` and the\ncommand\
      \ line with the evaluation notes."
    links: []
