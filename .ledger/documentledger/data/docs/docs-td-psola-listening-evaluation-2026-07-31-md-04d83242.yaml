    section_hash: b0bc48ee6d4da4b8918967db8ae9ccbabc1bd329d421efd4e3725a8a39d982c0
    summary: Promotion gates
    text:
      "## Promotion gates\n\n- At least two listeners for development screening\
      \ and at least ten before any\n  default-method consideration.\n- TD-PSOLA preferred\
      \ over current WSOLA pitch shifting in at least 65% of\n  moderate ±2/±4 semitone\
      \ trials.\n- Severe artifacts below 5% of trials, with no intelligibility regression.\n\
      - Objective synthetic and runtime gates pass alongside the listening result.\n\
      \nUntil these fields are populated and reviewed, TD-PSOLA remains experimental\
      \ and\nthe existing defaults remain phase vocoder for generic `time_stretch` and\
      \ WSOLA\nfor `apply_speech_effects`."
    links: []
