    section_hash: 564802c182c58ba34f5ecb9a209d87d676fbe8f5635943244f69da1387af03db
    summary: Resampling Internals
    text:
      "## Resampling Internals\n\nAudioSig uses windowed-sinc interpolation:\n\n\
      ```python\nfrom audiosig import resample\n\n# Control filter characteristics\n\
      result = resample(\n    audio,\n    source_rate=48000,\n    target_rate=16000,\n\
      \    filter_width=64,     # Wider = sharper cutoff, slower\n    rolloff=0.945,\
      \       # Anti-aliasing filter rolloff\n    length_mode='round', # Output length\
      \ calculation\n)\n```"
    links: []
