    text:
      "### Checking Intermediate Results\n\n```python\nimport numpy as np\nfrom\
      \ audiosig import frame_signal, frame_rms\n\ndef analyze_frames(audio, frame_length=2048,\
      \ hop_length=512):\n    \"\"\"Debug frame analysis.\"\"\"\n    frames = frame_signal(audio,\
      \ frame_length=frame_length, hop_length=hop_length)\n    rms = frame_rms(audio,\
      \ frame_length=frame_length, hop_length=hop_length)\n\n    print(f\"Audio length:\
      \ {len(audio)}\")\n    print(f\"Number of frames: {len(frames)}\")\n    print(f\"\
      Frame shape: {frames.shape}\")\n    print(f\"RMS range: [{np.min(rms):.4f}, {np.max(rms):.4f}]\"\
      )\n\n    return frames, rms\n```"
