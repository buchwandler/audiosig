      - 57
    section_hash: eb87d018f2e68ebfde57f935ebd0e13c4a7fe5f049e669a57d7d1dbaa2bc3270
    summary: Choosing a time-stretch backend
    text:
      "## Choosing a time-stretch backend\n\nAudioSig has three explicit time-stretch\
      \ backends. The basic phase vocoder is a\ngeneric numerical reference path; it\
      \ uses STFT/ISTFT phase propagation and can\nsound phasey around transients. WSOLA\
      \ is the speech-oriented default for\n`apply_speech_effects` and searches for\
      \ waveform-similar splice points in the\ntime domain. ESOLA is an experimental\
      \ speech backend that aligns fixed\nwaveform frames using detected epochs; it\
      \ supports `0.5 <= rate <= 2.0` and\nrequires `sample_rate`. WSOLA, ESOLA, and\
      \ TD-PSOLA process every non-sample\ndimension as an independent lane, so they\
      \ do not guarantee a stereo image or\nshared pitch/epoch decisions. For stereo\
      \ speech where image coherence matters,\nprovide a shared analysis signal and\
      \ apply its decisions in an application-level\nchannel wrapper; ordinary batch\
      \ and arbitrary-axis processing remains supported.\n\nUse WSOLA when processing\
      \ speech:\n\n```python\nfrom audiosig import apply_speech_effects, time_stretch\n\
      \nstretched = time_stretch(\n    audio,\n    rate=1.2,\n    sample_rate=24_000,\n\
      \    method=\"wsola\",\n)\nspeech = apply_speech_effects(audio, sample_rate=24_000,\
      \ rate=1.2)\n```\n\nUse ESOLA for an experimental moderate-range speech comparison:\n\
      \n```python\nstretched = time_stretch(\n    audio,\n    rate=1.25,\n    sample_rate=24_000,\n\
      \    method=\"esola\",\n)\n```\n\nUse the basic phase vocoder for generic array\
      \ processing or controlled\ncomparisons:\n\n```python\nfrom audiosig import time_stretch\n\
      \n# Control FFT resolution\nresult = time_stretch(\n    audio,\n    rate=1.2,\n\
      \    method=\"phase_vocoder\",\n    n_fft=4096,        # Higher = better frequency\
      \ resolution, worse time resolution\n    hop_length=1024,   # Controls overlap\
      \ between frames\n)\n```"
    links: []
  - section_id: md:section:docs/advanced.md::backend-trade-offs
    doc_path: docs/advanced.md
    heading_path:
      - Advanced Topics
      - Choosing a time-stretch backend
      - Backend trade-offs
    heading_slug: backend-trade-offs
    line_span:
      - 58
      - 84
    section_hash: 6929b2188219c52990dcabdf2d6085854f5057b470e595474a8c79b38e7cc567
    summary: Backend trade-offs
    text:
      "### Backend trade-offs\n\n- **WSOLA frame/overlap/search**: Defaults are\
      \ 30/10/10 ms and are sample-rate aware; larger searches cost more and can select\
      \ less stable matches.\n- **Phase-vocoder n_fft**: Larger values improve frequency\
      \ separation but worsen time precision.\n- **Phase-vocoder hop_length**: Typically\
      \ n_fft // 4 for the basic backend.\n- **ESOLA frame/epoch alignment**: Uses a\
      \ fixed 20 ms frame, 50% synthesis\n  overlap, NumPy epoch extraction, and a raised-cosine\
      \ pairwise crossfade.\n  It is speech-specific and remains experimental until\
      \ real-speech listening\n  results establish a stable benefit over WSOLA.\n\n\
      The standard compositor plans pitch and rate together using\n`tsm_rate = rate\
      \ / pitch_ratio`, then resamples once when necessary. Selecting\n`method=\"td_psola\"\
      ` uses a separate direct pitch/prosody path instead: it tracks\nvoicing and pulses,\
      \ changes synthesis-pulse spacing for voiced speech, and uses\nWSOLA for unvoiced\
      \ duration fallback. Its conservative limits are\n`-6..+6` semitones and `0.75..1.5`\
      \ rate. If too few pitch marks are available,\nthe direct path explicitly falls\
      \ back. Pure pitch requests use WSOLA plus\nresampling for the requested ratio;\
      \ duration-modification requests preserve\nunvoiced material with duration-only\
      \ WSOLA rather than globally tonalizing it.\nThe backend does not silently return\
      \ unchanged audio.\nAll paths preserve exact output-length and dtype contracts,\
      \ but TD-PSOLA does\nnot guarantee formant preservation and should not be treated\
      \ as a general music\nor polyphonic pitch-shifting backend.\n\nTD-PSOLA remains\
      \ experimental until objective, runtime, and real-speech\nlistening gates pass.\
      \ See the [evaluation protocol](td-psola-listening-evaluation-2026-07-31.md)."
    links: []
  - section_id: md:section:docs/advanced.md::time-varying-speech-envelopes
    doc_path: docs/advanced.md
