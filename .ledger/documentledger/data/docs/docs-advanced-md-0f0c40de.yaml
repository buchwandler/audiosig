    section_hash: 96b91a514069d9f426896e5007d9c9f95fc12f0acbfb7dbe57ddc9f14842a7c1
    summary: Fail-Fast vs Fail-Open
    text:
      "### Fail-Fast vs Fail-Open\n\n```python\nfrom audiosig import (\n    time_stretch,\n\
      \    AudioSignalError,\n    InvalidParameterError,\n    AudioShapeError,\n)\n\n\
      def safe_time_stretch(audio, rate, fail_fast=True):\n    \"\"\"Time stretch with\
      \ error handling.\"\"\"\n    try:\n        return time_stretch(audio, rate=rate)\n\
      \    except InvalidParameterError as e:\n        if fail_fast:\n            raise\n\
      \        print(f\"Warning: {e}\")\n        return audio  # Return original\n \
      \   except AudioShapeError as e:\n        if fail_fast:\n            raise\n \
      \       print(f\"Warning: Invalid shape: {e}\")\n        return audio\n\n# Fail-fast\
      \ (default)\nresult = safe_time_stretch(audio, rate=-1.0, fail_fast=True)\n\n\
      # Fail-open (return original on error)\nresult = safe_time_stretch(audio, rate=-1.0,\
      \ fail_fast=False)\n```"
