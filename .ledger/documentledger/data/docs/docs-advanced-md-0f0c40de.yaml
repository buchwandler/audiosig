    section_hash: 87d457b83bcbcb919e8f6a237d4af212de843c3a26b68d681f2c24201615cc58
    summary: Normalized Energy VAD
    text:
      "### Normalized Energy VAD\n\nThe normalized energy VAD works by:\n\n1. Framing\
      \ the audio into non-overlapping segments\n2. Computing RMS energy per frame\n\
      3. Normalizing to [0, 1] range\n4. Thresholding to detect activity\n\n```python\n\
      from audiosig import normalized_energy_vad\n\n# The algorithm in detail\nactivity\
      \ = normalized_energy_vad(\n    audio,\n    sample_rate=24000,\n    frame_duration_ms=10,\
      \     # 10ms frames = 240 samples\n    energy_threshold=0.15,    # 15% of max\
      \ energy\n    pad_end=False,            # Discard trailing partial frame\n)\n\
      ```"
    links: []
