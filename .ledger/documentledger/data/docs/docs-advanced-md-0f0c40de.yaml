    section_hash: 1caa7de475e266e652d6e9d1362c10e704d1aa8d7c798ccba8812a2c4979acfe
    summary: Relative dB VAD
    text:
      "### Relative dB VAD\n\nThe relative dB VAD works by:\n\n1. Computing short-time\
      \ energy\n2. Finding peak energy\n3. Setting threshold relative to peak\n4. Detecting\
      \ frames above threshold\n\n```python\nfrom audiosig import relative_db_vad\n\n\
      activity = relative_db_vad(\n    audio,\n    frame_length=2048,\n    hop_length=512,\n\
      \    threshold_db=40.0,  # 40 dB below peak\n)\n```"
    links: []
