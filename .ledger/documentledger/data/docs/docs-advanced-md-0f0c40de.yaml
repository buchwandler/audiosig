    summary: Performance Profiling
    text:
      "### Performance Profiling\n\n```python\nimport time\nimport numpy as np\n\
      from audiosig import time_stretch\n\ndef profile_time_stretch(audio, rate, iterations=100):\n\
      \    \"\"\"Profile time_stretch performance.\"\"\"\n    times = []\n\n    for\
      \ _ in range(iterations):\n        start = time.perf_counter()\n        result\
      \ = time_stretch(audio, rate=rate)\n        end = time.perf_counter()\n      \
      \  times.append(end - start)\n\n    avg_time = np.mean(times)\n    std_time =\
      \ np.std(times)\n\n    print(f\"Average: {avg_time*1000:.2f} ms\")\n    print(f\"\
      Std dev: {std_time*1000:.2f} ms\")\n    print(f\"Throughput: {len(audio) / avg_time\
      \ / 1e6:.2f} Msamples/s\")\n\n    return avg_time, std_time\n```"
    links: []
