    summary: Input Validation
    text:
      "### Input Validation\n\n```python\nimport numpy as np\nfrom audiosig import\
      \ AudioShapeError\n\ndef validate_audio_input(audio, expected_sr=None):\n    \"\
      \"\"Validate audio before processing.\"\"\"\n    if not isinstance(audio, np.ndarray):\n\
      \        raise TypeError(f\"Expected np.ndarray, got {type(audio)}\")\n\n    if\
      \ audio.dtype not in (np.float32, np.float64):\n        raise ValueError(f\"Expected\
      \ float32 or float64, got {audio.dtype}\")\n\n    if audio.ndim == 0:\n      \
      \  raise ValueError(\"Audio must have at least 1 dimension\")\n\n    if audio.size\
      \ == 0:\n        raise ValueError(\"Audio array is empty\")\n\n    return True\n\
      ```"
