    section_hash: 9ac96458149367b829a88d8bcca6bdee0f88386e09481b0dffe1362d6f949284
    summary: Empty Audio
    text: "### Empty Audio


      ```python

      import numpy as np

      from audiosig import trim, split


      # Empty arrays are handled gracefully

      empty = np.array([], dtype=np.float32)


      # trim returns empty array and [0, 0]

      trimmed, interval = trim(empty)

      assert len(trimmed) == 0

      assert np.array_equal(interval, [0, 0])


      # split returns empty intervals

      intervals = split(empty)

      assert len(intervals) == 0

      ```


      All public transformations, including `time_stretch`, `pitch_shift`, gain,

      normalization, and resampling, accept an empty sample axis after validating

      their parameters and return an empty copy with the original shape and dtype."
    links: []
