    summary: Basic Framing
    text:
      "### Basic Framing\n\n```python\nfrom audiosig import frame_signal, frame_rms\n\
      \naudio = create_sine_wave(440, duration=1.0, sample_rate=24000)\n\n# Split into\
      \ frames\nframes = frame_signal(\n    audio,\n    frame_length=2048,\n    hop_length=512,\n\
      )\nprint(f\"Audio shape: {audio.shape}\")\nprint(f\"Frames shape: {frames.shape}\"\
      )  # (n_frames, 2048)\n\n# Compute RMS per frame\nrms_values = frame_rms(\n  \
      \  audio,\n    frame_length=2048,\n    hop_length=512,\n)\nprint(f\"RMS shape:\
      \ {rms_values.shape}\")  # (n_frames,)\n```"
