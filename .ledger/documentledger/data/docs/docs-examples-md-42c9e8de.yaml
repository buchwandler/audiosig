    section_hash: ff9ee4b7382e30a164c2dc0fc23ae1b3ce4ce5baa38f37719369492c6a456696
    summary: Gain Control
    text:
      "### Gain Control\n\n```python\nfrom audiosig import apply_gain_db\n\naudio\
      \ = create_sine_wave(440, duration=1.0, sample_rate=24000)\n\n# Boost by 6 dB\n\
      boosted = apply_gain_db(audio, db=6.0)\n\n# Attenuate by 10 dB\nattenuated = apply_gain_db(audio,\
      \ db=-10.0)\n\n# With clipping protection\nloud_clipped = apply_gain_db(audio,\
      \ db=20.0, clip=True)\n\n# Fade in/out effect\ndef fade_in(audio, duration_samples):\n\
      \    \"\"\"Apply linear fade in.\"\"\"\n    fade = np.linspace(0, 1, duration_samples,\
      \ dtype=audio.dtype)\n    result = audio.copy()\n    result[:duration_samples]\
      \ *= fade\n    return result\n\ndef fade_out(audio, duration_samples):\n    \"\
      \"\"Apply linear fade out.\"\"\"\n    fade = np.linspace(1, 0, duration_samples,\
      \ dtype=audio.dtype)\n    result = audio.copy()\n    result[-duration_samples:]\
      \ *= fade\n    return result\n```"
    links: []
