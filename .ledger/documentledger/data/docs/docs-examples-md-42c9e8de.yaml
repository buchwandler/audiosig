    section_hash: eeaac01e3a95f37d9cf5ed26922fefa3f78a4a191682cecf6f31432667b19498
    summary: Speech Segmentation
    text:
      "### Speech Segmentation\n\n```python\nimport numpy as np\nfrom audiosig import\
      \ split, trim, normalized_energy_vad\n\ndef segment_speech(audio, sample_rate,\
      \ min_duration_ms=100):\n    \"\"\"Segment audio into speech portions.\"\"\"\n\
      \    # Split into non-silent intervals\n    intervals = split(\n        audio,\n\
      \        top_db=35.0,\n        frame_length=512,\n        hop_length=128,\n  \
      \  )\n\n    # Filter by minimum duration\n    min_samples = int(sample_rate *\
      \ min_duration_ms / 1000)\n    segments = []\n\n    for start, end in intervals:\n\
      \        if (end - start) >= min_samples:\n            segments.append(audio[start:end])\n\
      \n    return segments\n\n# Usage\naudio = load_audio(\"long_speech.wav\")\nsegments\
      \ = segment_speech(audio, sample_rate=24000)\nprint(f\"Found {len(segments)} speech\
      \ segments\")\n```"
    links: []
