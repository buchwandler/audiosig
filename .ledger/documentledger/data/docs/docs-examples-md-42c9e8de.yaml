    section_hash: 180a5899de9a557293a02748c599813edc54e411761698e1076a4589836483c4
    summary: Tuning VAD Parameters
    text:
      "### Tuning VAD Parameters\n\n```python\nfrom audiosig import normalized_energy_vad\n\
      \ndef detect_speech(audio, sample_rate, sensitivity='medium'):\n    \"\"\"Detect\
      \ speech with different sensitivity levels.\"\"\"\n    thresholds = {\n      \
      \  'low': 0.05,      # More permissive\n        'medium': 0.15,   # Balanced\n\
      \        'high': 0.30,     # More strict\n    }\n\n    return normalized_energy_vad(\n\
      \        audio,\n        sample_rate=sample_rate,\n        frame_duration_ms=10,\n\
      \        energy_threshold=thresholds[sensitivity],\n    )\n\n# Usage\nactivity\
      \ = detect_speech(audio, sample_rate=24000, sensitivity='medium')\n```"
    links: []
