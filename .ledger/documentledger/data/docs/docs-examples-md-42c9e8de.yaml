    section_hash: 9b4031ec9afbbeecb4d88e97989ab8968e264e13cc5530a8b79370b86694958c
    summary: Creating Test Signals
    text:
      "### Creating Test Signals\n\n```python\nimport numpy as np\n\ndef create_sine_wave(frequency=440,\
      \ duration=1.0, sample_rate=24000):\n    \"\"\"Create a sine wave for testing.\"\
      \"\"\n    t = np.linspace(0, duration, int(sample_rate * duration), dtype=np.float32)\n\
      \    return np.sin(2 * np.pi * frequency * t)\n\ndef create_chirp(f_start=220,\
      \ f_end=880, duration=1.0, sample_rate=24000):\n    \"\"\"Create a frequency sweep\
      \ for testing.\"\"\"\n    t = np.linspace(0, duration, int(sample_rate * duration),\
      \ dtype=np.float32)\n    frequency = f_start + (f_end - f_start) * t / duration\n\
      \    phase = 2 * np.pi * (f_start * t + (f_end - f_start) * t**2 / (2 * duration))\n\
      \    return np.sin(phase).astype(np.float32)\n```"
    links: []
