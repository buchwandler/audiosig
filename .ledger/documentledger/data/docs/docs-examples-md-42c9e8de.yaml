    section_hash: 812d26802713df5c1217ce19778b0759d93b9f8b5ef318673ef8972180673d71
    summary: Pitch Shifting Examples
    text:
      "### Pitch Shifting Examples\n\n```python\nfrom audiosig import pitch_shift\n\
      \naudio = create_sine_wave(440, duration=1.0, sample_rate=24000)\n\n# Raise pitch\
      \ by 1 octave (12 semitones)\noctave_up = pitch_shift(audio, sample_rate=24000,\
      \ semitones=12.0)\n\n# Lower pitch by 1 octave\noctave_down = pitch_shift(audio,\
      \ sample_rate=24000, semitones=-12.0)\n\n# Musical transposition\ndef transpose(audio,\
      \ semitones, sample_rate=24000):\n    \"\"\"Transpose audio by semitones.\"\"\"\
      \n    return pitch_shift(audio, sample_rate=sample_rate, semitones=semitones)\n\
      \n# A4 (440 Hz) to C5 (523 Hz) - about 3 semitones\nc5 = transpose(audio, semitones=3.0)\n\
      ```\n\nFor a speech-only experimental direct pitch path, keep changes moderate\
      \ and\nopt in explicitly:\n\n```python\nfrom audiosig import apply_speech_effects\n\
      \nspeech_up = apply_speech_effects(\n    audio,\n    sample_rate=24_000,\n   \
      \ semitones=4.0,\n    method=\"td_psola\",\n)\n```\n\nTD-PSOLA does not guarantee\
      \ formant preservation, does not pitch unvoiced\nregions, and is not intended\
      \ for music or polyphonic material."
    links: []
