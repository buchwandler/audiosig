    section_hash: 7846ce8515b1e2c0e484753d2d88e97f46d1da1a82acb8f98afc2935dee4ca6d
    summary: Finding Speech Boundaries
    text:
      "### Finding Speech Boundaries\n\n```python\nfrom audiosig import find_speech_bounds,\
      \ find_speech_start\n\n# Create test audio\nsample_rate = 24000\nsilence = np.zeros(sample_rate\
      \ // 2, dtype=np.float32)\nspeech = create_sine_wave(440, duration=1.0, sample_rate=sample_rate)\n\
      audio = np.concatenate([silence, speech, silence])\n\n# Find speech bounds\nbounds\
      \ = find_speech_bounds(audio, sample_rate=sample_rate)\nprint(f\"Speech from {bounds[0]}\
      \ to {bounds[1]}\")\n\n# Extract just the speech\nif not np.array_equal(bounds,\
      \ [0, 0]):\n    start, end = bounds\n    speech_only = audio[start:end]\n\n# Find\
      \ speech start\nstart_idx = find_speech_start(audio, sample_rate=sample_rate)\n\
      print(f\"Speech starts at sample {start_idx}\")\n```"
    links: []
