    section_hash: 3ebedd1d91c224e59d0a48cc08937e350c440bb20289f4462dfa4819df9ce69f
    summary: Feature Extraction
    text:
      "### Feature Extraction\n\n```python\nfrom audiosig import (\n    short_time_energy,\n\
      \    zero_crossing_rate,\n    spectral_flux,\n)\n\naudio = create_sine_wave(440,\
      \ duration=1.0, sample_rate=24000)\n\n# Short-time energy\nenergy = short_time_energy(audio,\
      \ frame_length=2048, hop_length=512)\n\n# Zero-crossing rate\nzcr = zero_crossing_rate(audio,\
      \ frame_length=2048, hop_length=512)\n\n# Spectral flux\nflux = spectral_flux(audio,\
      \ frame_length=2048, hop_length=512)\n\nprint(f\"Energy shape: {energy.shape}\"\
      )\nprint(f\"ZCR shape: {zcr.shape}\")\nprint(f\"Flux shape: {flux.shape}\")\n\
      ```"
