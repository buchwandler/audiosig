    section_hash: 3371a0b4407500caeee57beeb54b8264354209a3b93e18ac70e633bb94b6732d
    summary: Batch Processing
    text:
      "### Batch Processing\n\n```python\nimport numpy as np\nfrom audiosig import\
      \ time_stretch, pitch_shift\n\ndef process_batch(audio_list, rate=1.0, semitones=0.0,\
      \ sample_rate=24000):\n    \"\"\"Process a batch of audio files.\"\"\"\n    results\
      \ = []\n\n    for audio in audio_list:\n        # Apply time stretch if needed\n\
      \        if rate != 1.0:\n            audio = time_stretch(audio, rate=rate)\n\
      \n        # Apply pitch shift if needed\n        if semitones != 0.0:\n      \
      \      audio = pitch_shift(\n                audio,\n                sample_rate=sample_rate,\n\
      \                semitones=semitones,\n            )\n\n        results.append(audio)\n\
      \n    return results\n\n# Usage\naudio_files = [load_audio(f) for f in file_list]\n\
      processed = process_batch(audio_files, rate=1.1, semitones=2.0)\n```"
    links: []
