    section_hash: 434b83b06da5b062825f0728b86f5b5a4a6d131fc578baf1c4c2c234fcc0cb67
    summary: Basic VAD Usage
    text:
      "### Basic VAD Usage\n\n```python\nfrom audiosig import normalized_energy_vad,\
      \ energy_based_vad\n\n# Create audio with silence and speech\nsample_rate = 24000\n\
      silence = np.zeros(sample_rate // 2, dtype=np.float32)  # 0.5s silence\nspeech\
      \ = create_sine_wave(440, duration=0.5, sample_rate=sample_rate)\naudio = np.concatenate([silence,\
      \ speech, silence])\n\n# Detect voice activity\nactivity = normalized_energy_vad(\n\
      \    audio,\n    sample_rate=sample_rate,\n    frame_duration_ms=10,\n    energy_threshold=0.1,\n\
      )\n\nprint(f\"Active frames: {np.sum(activity)}\")\nprint(f\"Total frames: {len(activity)}\"\
      )\n```"
    links: []
