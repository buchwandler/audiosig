    section_hash: ce647ad49665ac49fbb4ef2700ab32c877695d3b02f5ba3ff074be80bf65d547
    summary: Smooth Cut-Point Selection
    text:
      "## Smooth Cut-Point Selection\n\nThis numeric example searches a synthetic\
      \ waveform near a preferred sample. The result is deterministic and remains inside\
      \ the caller's legal interval:\n\n```python\nimport numpy as np\nfrom audiosig\
      \ import find_smooth_cut_point\n\nsample_rate = 24_000\ntime = np.arange(sample_rate,\
      \ dtype=np.float32) / sample_rate\naudio = np.sin(2.0 * np.pi * 220.0 * time)\n\
      candidate = find_smooth_cut_point(\n    audio, start=10_000, end=14_000, anchor=12_000,\
      \ window_length=120\n )\nassert 10_000 <= candidate < 14_000\n```\n\nAudioSig\
      \ does not decide whether the interval is semantically legal or whether an application\
      \ should retry. It only selects a numeric waveform boundary."
