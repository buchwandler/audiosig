    section_hash: 4aee7b277a81c5581e78ca3a40aab35deec201e465724dbbb41bfc3fb677b880
    summary: Splitting Audio Segments
    text:
      "### Splitting Audio Segments\n\n```python\nfrom audiosig import split\n\n\
      # Create audio with multiple speech segments\nsample_rate = 24000\nsegment1 =\
      \ create_sine_wave(440, duration=0.3, sample_rate=sample_rate)\nsegment2 = create_sine_wave(880,\
      \ duration=0.3, sample_rate=sample_rate)\nsilence = np.zeros(sample_rate // 4,\
      \ dtype=np.float32)\n\naudio = np.concatenate([segment1, silence, segment2, silence,\
      \ segment1])\n\n# Split into non-silent segments\nintervals = split(audio, top_db=40.0,\
      \ frame_length=512, hop_length=128)\n\nprint(f\"Found {len(intervals)} segments\"\
      )\nfor i, (start, end) in enumerate(intervals):\n    segment = audio[start:end]\n\
      \    print(f\"Segment {i}: samples {start}-{end} ({len(segment)} samples)\")\n\
      ```"
    links: []
