    section_hash: 28de27837a3bf900a86a808632370a8e02f8a39cbc05046e70db98aa8866683e
    summary: Audio Preprocessing Pipeline
    text:
      "### Audio Preprocessing Pipeline\n\n```python\nimport numpy as np\nfrom audiosig\
      \ import (\n    trim,\n    peak_normalize,\n    resample,\n    normalized_energy_vad,\n\
      )\n\ndef preprocess_audio(audio, source_rate, target_rate=16000):\n    \"\"\"\
      Complete audio preprocessing pipeline.\"\"\"\n    # 1. Trim silence\n    trimmed,\
      \ _ = trim(audio, top_db=40.0)\n\n    # 2. Normalize amplitude\n    normalized\
      \ = peak_normalize(trimmed, peak=0.95)\n\n    # 3. Resample if needed\n    if\
      \ source_rate != target_rate:\n        resampled = resample(\n            normalized,\n\
      \            source_rate=source_rate,\n            target_rate=target_rate,\n\
      \        )\n    else:\n        resampled = normalized\n\n    return resampled\n\
      \n# Usage\naudio_48k = load_audio(\"speech.wav\")  # Your audio loading function\n\
      processed = preprocess_audio(audio_48k, source_rate=48000, target_rate=16000)\n\
      ```"
    links: []
