    observed_behavior:
      Added public output-time rate and semitone-envelope APIs with
      analytic rate-map timing and exact frame prediction. Variable-rate processing
      uses mapped WSOLA; variable-pitch processing coordinates voiced TD-PSOLA with
      mapped WSOLA fallback. Tests verify trajectories, exact lengths, validation, silence,
      channel/dtype preservation, transition continuity, and package exports. Documentation
      records that one listener heard no clear difference on one source, so no general
      perceptual-quality claim is made.
