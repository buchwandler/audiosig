[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10.1,<11", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosig"
dynamic = ["version"]
description = "Portable, dependency-light audio signal processing for NumPy arrays."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Holger Nahrstaedt", email = "nahrstaedt@gmail.com" }]
keywords = ["audio", "dsp", "signal-processing", "time-stretch", "pitch-shift", "resampling", "speech", "tts", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/buchwandler/audiosig"
Repository = "https://github.com/buchwandler/audiosig"
Issues = "https://github.com/buchwandler/audiosig/issues"
Changelog = "https://github.com/buchwandler/audiosig/blob/main/docs/changelog.md"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
librosa-compat = [
  "librosa==0.11.0",
]
build = [
  "build>=1.2",
  "twine>=5",
]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "twine>=5"]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["audiosig*"]

[tool.setuptools.package-data]
audiosig = ["py.typed"]

[tool.setuptools_scm]
version_file = "audiosig/_version.py"
write_to_source = true
fallback_version = "0.1.dev0"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
  "quality: deterministic native DSP quality-control test",
  "downstream: numeric downstream contract test",
  "librosa_compat: optional differential test against pinned librosa",
  "packaging: post-build wheel and source-distribution test",
  "slow: numerically heavier quality-control test",
]

[tool.coverage.run]
branch = true
source = ["audiosig"]
omit = ["audiosig/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["audiosig/_version.py"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PYI", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.10"
packages = ["audiosig"]
strict = true
warn_unreachable = true
disable_error_code = ["unused-ignore"]
